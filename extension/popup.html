<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slop Shield</title><link rel="stylesheet" href="ui.css"></head><body class="popup">
<header><div class="brand"><span class="brand-icon" aria-hidden="true"></span>slop shield</div><span class="version">01 / JEV</span></header>
<h1>A little less noise.</h1><p class="lead">White space where the slop used to be.</p>
<section class="card"><div class="row"><div><div class="site" id="site">Current page</div><div id="status" class="status">Loading…</div></div><button class="switch" id="toggle" role="switch" aria-label="Filter this site" aria-checked="false" disabled></button></div><div class="stats"><div><strong id="covered">0</strong><span>PASSAGES HIDDEN</span></div><div><strong id="checked">0</strong><span>CHECKED</span></div></div></section>
<div id="setup" hidden><button class="primary full" id="connect">Connect Jev →</button><p class="micro" style="margin-top:10px">Add a TypeSafe API key to start filtering.</p></div>
<div class="actions" id="controls"><button class="primary" id="rescan">Rescan page</button><button class="secondary" id="reveal">Reveal all</button></div>
<p id="message" class="message" role="status" aria-live="polite"></p><p class="micro" style="margin-top:14px">Enabling a site sends visible text to TypeSafe. Click any white box to reveal its text.</p>
<footer class="foot"><span class="badge">POWERED BY JEV</span><a class="text-button" href="logs.html" target="_blank">Request log ↗</a><button class="text-button" id="settings">Settings ↗</button></footer><script type="module" src="popup.js"></script></body></html>
